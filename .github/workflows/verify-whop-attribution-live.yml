name: Verify live Whop attribution API
on:
  push:
    branches:
      - verify/live-whop-events
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect production attribution health
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          body="$(mktemp)"
          status="$(curl -sS --max-time 20 -A 'Mozilla/5.0' -D "$headers" -o "$body" -w '%{http_code}' 'https://slayerkey.com/whop-attribution-health' || true)"
          echo "STATUS=$status"
          sed -n '1,40p' "$headers"
          head -c 1200 "$body" || true
          echo
