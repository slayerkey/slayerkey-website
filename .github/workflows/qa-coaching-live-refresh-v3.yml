name: QA Coaching Live Refresh V3

on:
  push:
    paths:
      - '.github/workflows/qa-coaching-live-refresh-v3.yml'

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright
          npx playwright install --with-deps chromium >/dev/null
      - name: Wait for public candidate
        run: |
          URL='https://slayerkey.com/wp-content/plugins/slayerkey-website/previews/live-refresh/coaching-live-refresh-v3/index.html'
          for i in $(seq 1 40); do
            BODY=$(curl -fsSL --max-time 20 "$URL" || true)
            if printf '%s' "$BODY" | grep -q 'coaching-live-refresh-v3'; then exit 0; fi
            sleep 10
          done
          exit 1
      - name: Browser journey QA
        run: |
          cat > qa.mjs <<'JS'
          import { chromium } from 'playwright';
          const url='https://slayerkey.com/wp-content/plugins/slayerkey-website/previews/live-refresh/coaching-live-refresh-v3/index.html';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1365,height:900}});
          await page.goto(url,{waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForTimeout(1800);
          const desktop=await page.evaluate(()=>{
            const q=s=>document.querySelector(s), qa=s=>[...document.querySelectorAll(s)];
            const y=s=>q(s).getBoundingClientRect().top+scrollY;
            const cards=qa('#coaching-pricing .price-card').map(e=>e.getBoundingClientRect());
            return {
              marker:q('meta[name="slayerkey-candidate"]')?.content,
              order:['#showcase','#psmr','#coaching-pricing','#proof-wall','#how','#reviews','#about'].map(s=>y(s)),
              sameRow:Math.abs(cards[0].top-cards[1].top)<2,
              pricing:q('#coaching-pricing')?.innerText||'',
              step:q('#how .stepx')?.innerText||'',
              overflow:document.documentElement.scrollWidth-innerWidth
            };
          });
          if(desktop.marker!=='coaching-live-refresh-v3') throw new Error('Wrong marker');
          for(let i=1;i<desktop.order.length;i++) if(!(desktop.order[i]>desktop.order[i-1])) throw new Error('Wrong section order '+desktop.order);
          if(!desktop.sameRow) throw new Error('Pricing cards not side by side');
          for(const t of ['Best Value','one time','Private Mentorship Monthly','monthly for 4 months','Start Your Mentorship']) if(!desktop.pricing.includes(t)) throw new Error('Missing pricing text '+t);
          if(!desktop.step.includes('Kickoff')||!desktop.step.includes('Schedule your first session')) throw new Error('Kickoff step missing');
          if(desktop.overflow>2) throw new Error('Desktop overflow '+desktop.overflow);
          await page.setViewportSize({width:390,height:844});
          await page.reload({waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForTimeout(1200);
          const mobile=await page.evaluate(()=>({
            overflow:document.documentElement.scrollWidth-innerWidth,
            cards:[...document.querySelectorAll('#coaching-pricing .price-card')].map(e=>e.getBoundingClientRect().width),
            pricing:document.querySelector('#coaching-pricing')?.innerText||''
          }));
          if(mobile.overflow>2) throw new Error('Mobile overflow '+mobile.overflow);
          if(mobile.cards.some(w=>w>390)) throw new Error('Mobile pricing card overflow '+mobile.cards);
          if(!mobile.pricing.includes('monthly for 4 months')) throw new Error('Monthly label missing on mobile');
          console.log(JSON.stringify({desktop,mobile},null,2));
          await browser.close();
          JS
          node qa.mjs
