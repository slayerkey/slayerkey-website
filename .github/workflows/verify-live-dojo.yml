name: Verify Live Dojo Homepage

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_SHA: ${{ github.sha }}

    steps:
      - name: Mark live Dojo verification pending
        uses: actions/github-script@v7
        with:
          script: |
            const sha = process.env.DEPLOY_SHA;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: 'pending',
              context: 'live-dojo/verify',
              description: 'Waiting for public Dojo homepage',
              target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`
            });

      - name: Verify public homepage and health
        run: |
          set -euo pipefail
          HOME_URL="https://slayerkey.com/?cb=$DEPLOY_SHA"
          HEALTH_URL="https://slayerkey.com/wp-json/slayerkey/v1/health?cb=$DEPLOY_SHA"

          verified=0
          for attempt in $(seq 1 24); do
            echo "Live verification attempt $attempt"
            home="$(curl -fsSL --connect-timeout 10 --max-time 25 -H 'Cache-Control: no-cache' "$HOME_URL" 2>/dev/null || true)"
            health="$(curl -fsSL --connect-timeout 10 --max-time 25 -H 'Cache-Control: no-cache' "$HEALTH_URL" 2>/dev/null || true)"

            deployed_commit="$(printf '%s' "$health" | jq -r '.deployed_commit // empty' 2>/dev/null || true)"
            public_enabled="$(printf '%s' "$health" | jq -r '.public_dojo_enabled // false' 2>/dev/null || true)"
            public_hook="$(printf '%s' "$health" | jq -r '.hooks.public_dojo_registered // false' 2>/dev/null || true)"

            if [ "$deployed_commit" = "$DEPLOY_SHA" ] \
              && [ "$public_enabled" = "true" ] \
              && [ "$public_hook" = "true" ] \
              && printf '%s' "$home" | grep -q 'Slayerkey live Dojo v3' \
              && printf '%s' "$home" | grep -q 'id="sk-std"' \
              && printf '%s' "$home" | grep -q 'Training Dojo Membership' \
              && ! printf '%s' "$home" | grep -q '\$15/month'; then
              verified=1
              break
            fi

            sleep 5
          done

          if [ "$verified" -ne 1 ]; then
            echo "Public homepage and health endpoint did not converge on $DEPLOY_SHA"
            exit 1
          fi

          echo "Public homepage and health endpoint both confirm $DEPLOY_SHA"

      - name: Mark live Dojo verification successful
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const sha = process.env.DEPLOY_SHA;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: 'success',
              context: 'live-dojo/verify',
              description: 'Public Dojo homepage verified',
              target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`
            });

      - name: Mark live Dojo verification failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const sha = process.env.DEPLOY_SHA;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: 'failure',
              context: 'live-dojo/verify',
              description: 'Public Dojo homepage verification failed',
              target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`
            });
