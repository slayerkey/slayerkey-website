name: Scheduled Live Dojo Smoke
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: slayerkey-easywp-production
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Determine expected release, excluding documentation-only changes
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_ROLLBACK: ${{ vars.SLAYERKEY_EXPECTED_DEPLOY_SHA }}
        run: |
          if [[ -n "$APPROVED_ROLLBACK" ]]; then
            [[ "$APPROVED_ROLLBACK" == '0ff5f81f6337650e47b3d1a0e18e38117466f2e7' ]]
            release="$APPROVED_ROLLBACK"
            echo 'ROLLBACK_RUNTIME=1' >> "$GITHUB_ENV"
          else
            release=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs?branch=main&per_page=1" --jq '.workflow_runs[0].head_sha')
          fi
          [[ "$release" =~ ^[a-f0-9]{40}$ ]]
          echo "DEPLOY_SHA=$release" >> "$GITHUB_ENV"
      - run: npm run test:live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scheduled-live-evidence
          path: artifacts/live/
