name: Build System Live Refresh V3

on:
  push:
    paths:
      - '.github/workflows/build-system-live-refresh-v3.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install parser
        run: python -m pip install --quiet beautifulsoup4
      - name: Build conservative System v3
        run: |
          python - <<'PY'
          from bs4 import BeautifulSoup
          from pathlib import Path

          src = Path('wordpress/slayerkey-website/previews/live-refresh/system-live-refresh-v2/index.html')
          out = Path('wordpress/slayerkey-website/previews/live-refresh/system-live-refresh-v3/index.html')
          soup = BeautifulSoup(src.read_text(encoding='utf-8'), 'html.parser')

          marker = soup.find('meta', attrs={'name':'slayerkey-candidate'})
          if marker:
              marker['content'] = 'system-live-refresh-v3'
          else:
              marker = soup.new_tag('meta')
              marker['name'] = 'slayerkey-candidate'
              marker['content'] = 'system-live-refresh-v3'
              soup.head.append(marker)

          hero = soup.select_one('#hero') or soup.find('section')
          if not hero:
              raise SystemExit('Hero section missing')

          hero_buttons = hero.select('a.btn')
          if len(hero_buttons) < 2:
              raise SystemExit(f'Expected at least two hero buttons, found {len(hero_buttons)}')

          primary = hero_buttons[0]
          primary.string = 'Start Improving'
          primary['href'] = '#final'
          primary['target'] = '_self'
          primary['data-cta'] = 'start_improving_hero'

          secondary = hero_buttons[1]
          secondary.string = 'Explore The System'
          secondary['href'] = '#inside'
          secondary['target'] = '_self'
          secondary['data-cta'] = 'explore_system_hero'

          showcase = soup.select_one('#showcase')
          voices = soup.select_one('#owner-voices')
          solution = soup.select_one('#solution')
          how = soup.select_one('#how')
          inside = soup.select_one('#inside')
          final = soup.select_one('#final')
          proof_wall = soup.select_one('#proof-wall')
          if not all([showcase, voices, solution, how, inside, final, proof_wall]):
              missing = [name for name,node in [('showcase',showcase),('owner-voices',voices),('solution',solution),('how',how),('inside',inside),('final',final),('proof-wall',proof_wall)] if node is None]
              raise SystemExit('Missing sections: '+', '.join(missing))

          def cta_block(kicker, copy, label, ident):
              wrap = soup.new_tag('div')
              wrap['class'] = ['system-inline-cta','reveal']
              wrap['data-system-cta'] = ident
              text = soup.new_tag('div')
              text['class'] = ['system-inline-copy']
              k = soup.new_tag('strong')
              k.string = kicker
              p = soup.new_tag('span')
              p.string = copy
              text.append(k)
              text.append(p)
              a = soup.new_tag('a', href='#final')
              a['class'] = ['btn']
              a['target'] = '_self'
              a['data-cta'] = ident
              a.string = label
              wrap.append(text)
              wrap.append(a)
              return wrap

          # Proof should lead directly into the compact owner quotes, without a giant dead gap.
          # Add a transformation-led CTA after the owner proof for buyers already convinced by results.
          voice_container = voices.select_one('.container')
          if voice_container and not voices.select_one('[data-system-cta="proof_start"]'):
              voice_container.append(cta_block('Build Your Own Climb', 'Use the System to stop guessing what deserves your attention next.', 'Start Improving', 'proof_start'))

          # After the process is understood, give an easy path to the offer without forcing more scrolling.
          how_container = how.select_one('.container')
          if how_container and not how.select_one('[data-system-cta="process_start"]'):
              how_container.append(cta_block('Know What To Work On Next', 'Find the bottleneck, train it, apply it, then review what changed.', 'Start Improving', 'process_start'))

          # After the deeper Discord proof, make the purchase path readily available again.
          proof_container = proof_wall.select_one('.container')
          if proof_container and not proof_wall.select_one('[data-system-cta="reviews_get"]'):
              proof_container.append(cta_block('Ready To Stop Guessing?', 'Everything above is built to turn ranked into a repeatable improvement process.', 'Get The System', 'reviews_get'))

          style = soup.new_tag('style')
          style.string = '''
          /* System v3: CTA availability + proof spacing only. Keep the v2 section order/design. */
          #sk-wb #showcase{padding-bottom:20px!important}
          #sk-wb #owner-voices{padding-top:0!important;padding-bottom:38px!important}
          #sk-wb .system-inline-cta{max-width:900px;margin:26px auto 0;padding:16px 18px;border:1px solid rgba(45,226,197,.25);border-left:3px solid var(--teal);background:linear-gradient(90deg,rgba(45,226,197,.07),rgba(255,70,85,.04));display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}
          #sk-wb .system-inline-copy{display:flex;flex-direction:column;gap:3px;min-width:min(100%,340px);flex:1}
          #sk-wb .system-inline-copy strong{font-size:.95rem;color:var(--ink)}
          #sk-wb .system-inline-copy span{font-size:.88rem;color:var(--muted);line-height:1.45}
          #sk-wb .system-inline-cta .btn{margin:0;white-space:nowrap}
          @media(max-width:640px){
            #sk-wb #showcase{padding-bottom:12px!important}
            #sk-wb #owner-voices{padding-top:0!important;padding-bottom:28px!important}
            #sk-wb .system-inline-cta{margin-top:20px;padding:15px;align-items:stretch}
            #sk-wb .system-inline-cta .btn{width:100%;text-align:center}
          }
          '''
          soup.head.append(style)

          # Assertions: no structural reshuffle, price still only lives in the offer.
          order = ['showcase','owner-voices','solution','how','inside','final','proof-wall']
          html = str(soup)
          pos = [html.find(f'id="{sid}"') for sid in order]
          if any(p < 0 for p in pos) or pos != sorted(pos):
              raise SystemExit('System section order changed unexpectedly')
          if primary.get_text(' ', strip=True) != 'Start Improving' or primary.get('href') != '#final':
              raise SystemExit('Hero transformation CTA incorrect')
          if secondary.get_text(' ', strip=True) != 'Explore The System' or secondary.get('href') != '#inside':
              raise SystemExit('Hero explore CTA incorrect')
          if len(soup.select('[data-system-cta]')) != 3:
              raise SystemExit('Expected exactly three inline CTA blocks')
          if soup.select_one('#guarantee'):
              raise SystemExit('Standalone guarantee section returned')

          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(str(soup), encoding='utf-8')
          print('Built', out)
          PY
      - name: Commit candidate
        run: |
          git config user.name "slayerkey"
          git config user.email "34904637+slayerkey@users.noreply.github.com"
          git add wordpress/slayerkey-website/previews/live-refresh/system-live-refresh-v3/index.html
          git commit -m "Improve System CTA availability and proof spacing"
          git push
