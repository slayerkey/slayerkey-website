name: QA Live Coaching V3

on:
  push:
    paths:
      - '.github/workflows/qa-live-coaching-v3.yml'

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright
          npx playwright install --with-deps chromium >/dev/null
      - name: Wait for live Coaching route
        run: |
          URL='https://slayerkey.com/coaching/?utm_source=youtube&utm_medium=description&utm_campaign=mentorship_test&utm_content=hero_cta'
          for i in $(seq 1 50); do
            BODY=$(curl -fsSL --max-time 20 "$URL" || true)
            if printf '%s' "$BODY" | grep -q 'slayerkey-live-page'; then
              echo 'Live Coaching route is public'
              exit 0
            fi
            echo "Waiting for production Coaching ($i/50)"
            sleep 10
          done
          exit 1
      - name: Browser route and tracking QA
        run: node tools/qa_live_coaching_v3.mjs
