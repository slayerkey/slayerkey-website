name: Homepage Reliability Checks
on:
  workflow_call:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Reclaim runner disk for browser matrix
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          df -h /
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:unit
      - run: python3 tests/publish_test.py
      - run: npm run test:php
      - run: python3 tools/build_deploy.py --output build/php-check/plugin
      - run: php tests/wordpress.php build/php-check/plugin
      - name: Run Chromium browser matrix
        run: npx playwright test --project=chromium-desktop --project=chromium-390 --project=chromium-430
      - run: npm run test:soak
      - uses: actions/upload-artifact@v4
        if: failure()
        continue-on-error: true
        with:
          name: reliability-evidence-${{ github.run_id }}
          path: |
            artifacts/
            playwright-report/
            test-results/
          retention-days: 1
