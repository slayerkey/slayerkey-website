name: Homepage Reliability Checks
on:
  workflow_call:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  reliability:
    runs-on: [self-hosted, Windows, X64, key-pc]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Show runner disk
        shell: powershell
        run: Get-PSDrive -PSProvider FileSystem
      - run: npm ci
      - run: npx playwright install chromium webkit
      - run: npm run test:unit
      - run: python tests/publish_test.py
      - run: npm run test:php
      - run: python tools/build_deploy.py --output build/php-check/plugin
      - run: php tests/wordpress.php build/php-check/plugin
      - run: npm test
      - run: npm run test:soak
      - uses: actions/upload-artifact@v4
        if: failure()
        continue-on-error: true
        with:
          name: reliability-evidence-${{ github.run_id }}
          path: |
            artifacts/
            playwright-report/
            test-results/
          retention-days: 1
