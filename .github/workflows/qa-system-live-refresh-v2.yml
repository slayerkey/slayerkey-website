name: QA System Live Refresh V2

on:
  push:
    paths:
      - '.github/workflows/qa-system-live-refresh-v2.yml'

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright
          npx playwright install --with-deps chromium >/dev/null
      - name: Wait for public candidate
        run: |
          URL='https://slayerkey.com/wp-content/plugins/slayerkey-website/previews/live-refresh/system-live-refresh-v2/index.html'
          for i in $(seq 1 40); do
            BODY=$(curl -fsSL --max-time 20 "$URL" || true)
            if printf '%s' "$BODY" | grep -q 'system-live-refresh-v2'; then
              echo 'Candidate is public'
              exit 0
            fi
            echo "Waiting for candidate deployment ($i/40)"
            sleep 10
          done
          exit 1
      - name: Browser journey QA
        run: |
          cat > qa.mjs <<'JS'
          import { chromium } from 'playwright';
          const url='https://slayerkey.com/wp-content/plugins/slayerkey-website/previews/live-refresh/system-live-refresh-v2/index.html';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1365,height:900}});
          const errors=[];
          page.on('pageerror',e=>errors.push(String(e)));
          await page.goto(url,{waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForTimeout(2200);
          const desktop=await page.evaluate(()=>{
            const q=s=>document.querySelector(s), qa=s=>[...document.querySelectorAll(s)];
            const y=s=>q(s)?.getBoundingClientRect().top+scrollY;
            const buy=s=>qa(`${s} a[href*="buy.stripe.com"]`).length;
            return {
              marker:q('meta[name="slayerkey-candidate"]')?.content,
              heroText:q('#top')?.innerText||'',
              heroBuy:buy('#top'), howBuy:buy('#how'), insideBuy:buy('#inside'),
              ownerQuotes:qa('#owner-voices .owner-voice').length,
              order:['#showcase','#owner-voices','#solution','#how','#inside','#final','#proof-wall','#system-faq'].map(s=>[s,y(s)]),
              finalText:q('#final')?.innerText||'',
              standaloneGuarantee:!!q('#guarantee'),
              reviewRail:!!q('#wb-reviews'),
              overflow:document.documentElement.scrollWidth-innerWidth
            };
          });
          if(desktop.marker!=='system-live-refresh-v2') throw new Error('Wrong marker');
          if(desktop.heroText.includes('$249')||desktop.heroText.toLowerCase().includes('30-day guarantee')) throw new Error('Hero exposes price/guarantee');
          if(desktop.heroBuy||desktop.howBuy||desktop.insideBuy) throw new Error('Purchase CTA appears before offer');
          if(desktop.ownerQuotes!==2) throw new Error('Expected exactly two compact owner quotes');
          if(!desktop.finalText.includes('$249')||!desktop.finalText.includes('Lifetime access')||!desktop.finalText.includes('30-day guarantee')) throw new Error('Offer missing price/access/guarantee');
          if(desktop.standaloneGuarantee) throw new Error('Standalone guarantee section remains');
          if(desktop.reviewRail) throw new Error('Redundant text review rail remains');
          const ys=desktop.order.map(([,n])=>n);
          if(ys.some(n=>typeof n!=='number')) throw new Error('Required section missing');
          for(let i=1;i<ys.length;i++) if(!(ys[i]>ys[i-1])) throw new Error('Wrong section order '+JSON.stringify(desktop.order));
          if(desktop.overflow>2) throw new Error('Desktop overflow '+desktop.overflow);
          await page.setViewportSize({width:390,height:844});
          await page.reload({waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForTimeout(1400);
          const mobile=await page.evaluate(()=>({
            overflow:document.documentElement.scrollWidth-innerWidth,
            ownerCols:getComputedStyle(document.querySelector('#owner-voices .owner-voice-grid')).gridTemplateColumns,
            offerWidth:document.querySelector('#final .wb-final')?.getBoundingClientRect().width||0
          }));
          if(mobile.overflow>2) throw new Error('Mobile overflow '+mobile.overflow);
          if(mobile.ownerCols.split(' ').length!==1) throw new Error('Owner quotes do not stack on mobile: '+mobile.ownerCols);
          if(mobile.offerWidth>390) throw new Error('Offer wider than viewport');
          if(errors.length) throw new Error('Page JS errors: '+errors.join(' | '));
          console.log(JSON.stringify({desktop,mobile},null,2));
          await browser.close();
          JS
          node qa.mjs
