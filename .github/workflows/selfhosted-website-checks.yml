name: Self Hosted Website Reliability Checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'wordpress/**'
      - 'tests/**'
      - 'tools/**'
      - 'docs/wordpress/wpcode/**'
      - '.github/workflows/selfhosted-website-checks.yml'

permissions:
  contents: read

jobs:
  selfhosted-reliability:
    runs-on: self-hosted
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Setup portable PHP
        shell: powershell
        run: |
          $phpVersion = '8.5.10'
          $phpUrl = 'https://downloads.php.net/~windows/releases/archives/php-8.5.10-nts-Win32-vs17-x64.zip'
          $phpSha256 = '22ec430195984d233eb9e62c637a945bbcda06efca2f392d9d96d62c6acd34f8'
          $phpDir = Join-Path $env:RUNNER_TEMP "php-$phpVersion"
          $phpZip = Join-Path $env:RUNNER_TEMP "php-$phpVersion.zip"

          if (-not (Test-Path (Join-Path $phpDir 'php.exe'))) {
            Remove-Item $phpDir -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item $phpZip -Force -ErrorAction SilentlyContinue

            Invoke-WebRequest -Uri $phpUrl -OutFile $phpZip

            $actualHash = (Get-FileHash $phpZip -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -ne $phpSha256) {
              throw "Portable PHP SHA256 mismatch. Expected $phpSha256 but got $actualHash."
            }

            Expand-Archive -LiteralPath $phpZip -DestinationPath $phpDir -Force
          }

          $phpExe = Join-Path $phpDir 'php.exe'
          if (-not (Test-Path $phpExe)) {
            throw "Portable PHP executable was not created."
          }

          $phpDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "PHP_EXE=$phpExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $phpExe --version

      - name: Preflight
        shell: powershell
        run: |
          node --version
          npm --version
          git --version

          $pythonExe = $null

          $python = Get-Command python -ErrorAction SilentlyContinue
          if ($python) {
            try {
              & $python.Source -c "import sys; print(sys.executable)" | Out-Null
              if ($LASTEXITCODE -eq 0) {
                $pythonExe = $python.Source
              }
            } catch {}
          }

          if (-not $pythonExe) {
            $py = Get-Command py -ErrorAction SilentlyContinue
            if ($py) {
              try {
                $detected = & $py.Source -3 -c "import sys; print(sys.executable)"
                if ($LASTEXITCODE -eq 0 -and $detected) {
                  $pythonExe = $detected.Trim()
                }
              } catch {}
            }
          }

          if (-not $pythonExe) {
            $candidates = @()
            $candidates += Get-ChildItem "$env:LOCALAPPDATA\Programs\Python\Python*\python.exe" -ErrorAction SilentlyContinue
            $candidates += Get-ChildItem "C:\Python*\python.exe" -ErrorAction SilentlyContinue
            $commonPython = $candidates | Sort-Object FullName -Descending | Select-Object -First 1
            if ($commonPython) {
              $pythonExe = $commonPython.FullName
            }
          }

          if (-not $pythonExe -or -not (Test-Path $pythonExe)) {
            throw "Python is required for the website reliability suite but no usable installation was found on this runner."
          }

          "PYTHON_EXE=$pythonExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $pythonExe --version

          if (-not $env:PHP_EXE -or -not (Test-Path $env:PHP_EXE)) {
            throw "Portable PHP setup did not expose a usable executable."
          }

          & $env:PHP_EXE --version

      - run: npm ci

      - name: Install Playwright browsers
        shell: powershell
        run: npx playwright install chromium webkit

      - run: npm run test:unit

      - name: Publisher tests
        shell: powershell
        run: '& $env:PYTHON_EXE tests/publish_test.py'

      - run: npm run test:php

      - name: Build fingerprinted plugin
        shell: powershell
        run: '& $env:PYTHON_EXE tools/build_deploy.py --output build/php-check/plugin'

      - name: Test built plugin
        shell: powershell
        run: php tests/wordpress.php build/php-check/plugin

      - name: Browser matrix
        run: npm test

      - name: Soak test
        run: npm run test:soak

      - uses: actions/upload-artifact@v4
        if: failure()
        continue-on-error: true
        with:
          name: selfhosted-reliability-evidence-${{ github.run_id }}
          path: |
            artifacts/
            playwright-report/
            test-results/
          retention-days: 1
