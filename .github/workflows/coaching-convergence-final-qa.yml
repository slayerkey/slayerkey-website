name: Final Coaching Convergence QA

on:
  push:
    paths:
      - '.github/workflows/coaching-convergence-final-qa.yml'
      - 'wordpress/slayerkey-website/previews/convergence/coaching-convergence-v4/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Wait for exact deployment
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 48); do
            D=$(curl -fsSL --max-time 12 'https://slayerkey.com/wp-json/slayerkey/v1/health' | python -c "import json,sys; print(json.load(sys.stdin).get('deployed_commit') or '')" || true)
            echo "deployed=$D target=$GITHUB_SHA"
            [ "$D" = "$GITHUB_SHA" ] && break
            sleep 5
          done
          [ "$D" = "$GITHUB_SHA" ]
          for U in \
            'https://slayerkey.com/wp-content/uploads/2025/01/beta-bronze-Copy.png' \
            'https://slayerkey.com/wp-content/uploads/2025/01/top600career-copy2.png'; do
            CODE=$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 20 "$U" || true)
            TYPE=$(curl -L -sSI --max-time 20 "$U" | awk -F': ' 'tolower($1)=="content-type"{print $2}' | tr -d '\r' | tail -1 || true)
            echo "BRONZE_ASSET status=$CODE type=$TYPE url=$U"
          done
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Test and capture Coaching
        shell: bash
        run: |
          mkdir -p coaching-qa
          cat > coaching-qa.js <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const url='https://slayerkey.com/wp-content/plugins/slayerkey-website/previews/convergence/coaching-convergence-v4/index.html';
          const sizes={desktop:[1440,900],tablet:[900,1000],mobile:[390,844]};
          const report=[]; let bad=false;
          const check=(ok,msg,a)=>{if(!ok)a.push(msg)};
          async function scrollAll(page,h){
            const total=await page.evaluate(()=>document.documentElement.scrollHeight);
            for(let y=0;y<total;y+=Math.max(340,Math.floor(h*.68))){await page.evaluate(v=>scrollTo(0,v),y);await page.waitForTimeout(120)}
            await page.evaluate(()=>scrollTo(0,document.documentElement.scrollHeight));await page.waitForTimeout(450);await page.evaluate(()=>scrollTo(0,0));await page.waitForTimeout(350);
          }
          async function center(page,selector){await page.locator(selector).first().evaluate(el=>el.scrollIntoView({block:'center',behavior:'instant'}));await page.waitForTimeout(180)}
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const [mode,d] of Object.entries(sizes)){
              const [width,height]=d;
              const context=await browser.newContext({viewport:{width,height},reducedMotion:'no-preference'});
              const page=await context.newPage(); const errs=[]; page.on('pageerror',e=>errs.push(String(e)));
              const response=await page.goto(url+'?qa='+Date.now(),{waitUntil:'domcontentloaded',timeout:90000}); const failures=[];
              check(response&&response.status()===200,'HTTP not 200',failures); await page.waitForTimeout(800); await scrollAll(page,height);
              const layout=await page.locator('#sk-coaching').evaluate(el=>{const h=getComputedStyle(el.querySelector('h1'));const r=[...el.querySelectorAll('.reveal')];return{h1:parseFloat(h.fontSize),transform:h.textTransform,total:r.length,visible:r.filter(x=>parseFloat(getComputedStyle(x).opacity)>.9).length}});
              check(layout.h1>30&&layout.transform==='uppercase','CSS/display typography missing',failures); check(layout.total===layout.visible,`reveals ${layout.visible}/${layout.total}`,failures);
              const over=await page.evaluate(()=>[document.documentElement.scrollWidth,document.documentElement.clientWidth]); check(over[0]<=over[1]+2,`overflow ${over}`,failures);
              const broken=await page.locator('#sk-coaching img[src]:not([src=""])').evaluateAll(imgs=>imgs.map(i=>({src:i.currentSrc||i.src,w:i.naturalWidth,h:i.naturalHeight,c:i.complete})).filter(i=>!i.src.includes('i.ytimg.com/')&&(!i.c||!i.w||!i.h))); check(!broken.length,'broken images '+broken.map(x=>x.src).join(','),failures);
              const text=(await page.locator('#sk-coaching').innerText()).toLowerCase(); for(const s of ['$197','$870','$150','ko-fi.com','tally.so','usage guarantee','no outcome is guaranteed'])check(!text.includes(s.toLowerCase()),'stale '+s,failures);
              const hero=await page.locator('#sk-coaching section:first-of-type').innerText(); check(!hero.includes('$1,200')&&!hero.includes('$325'),'price in hero',failures);
              check((await page.locator('#coachingVideo').getAttribute('src')||'').includes('pEa4AcERI_k'),'wrong VSL',failures);
              check(await page.locator('a[href^="https://buy.stripe.com/00w28q3IR4eg8IZ8VH04806"]').count()===1,'upfront checkout',failures); check(await page.locator('a[href^="https://buy.stripe.com/4gM00i3IR4eg3oF0pb04805"]').count()===1,'four pay checkout',failures);
              const order=await page.locator('#sk-coaching section').evaluateAll(n=>n.map(x=>x.id||x.className)); check(order.indexOf('proof')<order.indexOf('why')&&order.indexOf('why')<order.indexOf('mentorship')&&order.indexOf('mentorship')<order.indexOf('students')&&order.indexOf('students')<order.indexOf('pricing'),'section order',failures);
              await center(page,'.ch-review-track'); const track=page.locator('.ch-review-track'); const a=await track.evaluate(x=>getComputedStyle(x).transform); await page.waitForTimeout(1100); const b=await track.evaluate(x=>getComputedStyle(x).transform); check(a!==b&&b!=='none','review rail not moving',failures);
              await center(page,'[data-yt]'); await page.locator('[data-yt]').first().click(); await page.waitForTimeout(400); check(await page.locator('#coachingVideoLightbox').evaluate(x=>x.classList.contains('open')),'testimonial modal',failures); const box=await page.locator('.ch-video-frame').boundingBox(); check(box&&box.width/box.height>1.70&&box.width/box.height<1.82,'testimonial ratio',failures); await page.keyboard.press('Escape');
              await center(page,'[data-proof-src]'); await page.locator('[data-proof-src]').first().click(); await page.waitForTimeout(150); check(await page.locator('#coachingLightbox').evaluate(x=>x.classList.contains('open')),'proof modal',failures); await page.keyboard.press('Escape');
              await scrollAll(page,height); const heroBox=await page.locator('#sk-coaching section:first-of-type').boundingBox(); const price=await page.locator('#pricing').boundingBox();
              report.push({mode,failures,metrics:{width,height,scrollHeight:await page.evaluate(()=>document.documentElement.scrollHeight),heroHeight:heroBox&&Math.round(heroBox.height),pricingTop:price&&Math.round(price.y),order,layout,pageErrors:errs}}); if(failures.length)bad=true;
              await page.screenshot({path:`coaching-qa/coaching-${mode}.png`,fullPage:true}); await context.close();
            }
            await browser.close(); fs.writeFileSync('coaching-qa/report.json',JSON.stringify(report,null,2)); console.log(JSON.stringify(report,null,2)); if(bad)process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node coaching-qa.js
      - name: Upload Coaching QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coaching-convergence-qa-${{ github.sha }}
          path: coaching-qa
          if-no-files-found: warn
