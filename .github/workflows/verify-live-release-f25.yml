name: Verify Live Website Release F25
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read live health
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -fsS --max-time 15 'https://slayerkey.com/wp-json/slayerkey/v1/health')"
          echo "$body" | jq '{deployed_commit,version}'
