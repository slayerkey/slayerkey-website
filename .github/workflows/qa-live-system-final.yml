name: QA Live System Final

on:
  push:
    paths:
      - '.github/workflows/qa-live-system-final.yml'

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Test live System route and tracking
        run: |
          cat > /tmp/qa-system.js <<'JS'
          const { chromium } = require('playwright');
          const assert = require('assert');

          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
            const errors = [];
            page.on('pageerror', e => errors.push(String(e)));

            const url = 'https://slayerkey.com/system/?utm_source=youtube&utm_medium=video&utm_campaign=system-live-qa&utm_content=cta-test&qa=' + Date.now();
            const res = await page.goto(url, { waitUntil:'domcontentloaded', timeout:60000 });
            assert(res && res.status() === 200, 'Expected /system/ HTTP 200');
            await page.waitForTimeout(1800);

            const live = await page.locator('meta[name="slayerkey-live-page"]').getAttribute('content');
            assert.strictEqual(live, 'system-live-refresh-v7', 'Wrong live System marker');
            const canonical = await page.locator('link[rel="canonical"]').getAttribute('href');
            assert.strictEqual(canonical, 'https://slayerkey.com/system/', 'Wrong canonical');

            const body = await page.locator('body').innerText();
            for (const text of ['Gold 2 → Diamond 1', '+500 RR · 35 Days', 'Ascendant 2 → Radiant', '8 Days', '$249', 'Lifetime access', '30 day guarantee', 'Prefer 1:1 coaching?', 'See coaching options', '6-Month Improvement Plan', 'All-In-One Fundamentals', 'Agent & Map Masterclasses', 'AI Coach']) {
              assert(body.includes(text), 'Missing live text: ' + text);
            }
            assert(!body.includes('$197'), 'Stale $197 visible');

            const coachingHref = await page.locator('a[data-cta="offer_coaching"]').getAttribute('href');
            assert(coachingHref === '/coaching/' || coachingHref === 'https://slayerkey.com/coaching/', 'Wrong coaching cross-link');

            const stripe = page.locator('a[href*="buy.stripe.com/28EbJ04MV4ege3j8VH04804"]').first();
            await stripe.waitFor({state:'visible'});
            await page.waitForTimeout(500);
            const href = await stripe.getAttribute('href');
            for (const q of ['utm_source=youtube','utm_medium=video','utm_campaign=system-live-qa','utm_content=cta-test']) {
              assert(href.includes(q), 'Stripe link missing attribution: ' + q + ' in ' + href);
            }

            await page.evaluate(() => {
              window.__qaGtag = [];
              window.__qaPosthog = [];
              const og = window.gtag;
              window.gtag = function(){ window.__qaGtag.push(Array.from(arguments)); if (typeof og === 'function') return og.apply(this, arguments); };
              if (window.posthog && typeof window.posthog.capture === 'function') {
                const op = window.posthog.capture.bind(window.posthog);
                window.posthog.capture = function(){ window.__qaPosthog.push(Array.from(arguments)); return op.apply(this, arguments); };
              }
              document.addEventListener('click', function(e){ const a=e.target.closest('a[href*="buy.stripe.com"]'); if(a) e.preventDefault(); }, true);
            });
            await stripe.click();
            await page.waitForTimeout(250);
            const tracked = await page.evaluate(() => ({g:window.__qaGtag,p:window.__qaPosthog}));
            const ga = tracked.g.find(x => x[0] === 'event' && x[1] === 'begin_checkout');
            assert(ga, 'GA4 begin_checkout did not fire');
            assert(Number(ga[2]?.value) === 249, 'GA4 checkout value is not 249');
            const ph = tracked.p.find(x => x[0] === 'begin_checkout');
            assert(ph, 'PostHog begin_checkout did not fire');
            assert(Number(ph[1]?.value) === 249, 'PostHog checkout value is not 249');

            await page.setViewportSize({width:390,height:844});
            const overflow = await page.evaluate(() => Math.max(0, document.documentElement.scrollWidth - document.documentElement.clientWidth));
            assert(overflow <= 1, 'Mobile horizontal overflow: ' + overflow + 'px');

            const html = await page.content();
            for (const marker of ['G-0SZBZW0HP6','edge.slayerkey.com','v9sofegg9a','price_1U8WzqArG6inWxHPI4WlZjPo']) {
              assert(html.includes(marker), 'Missing analytics marker: ' + marker);
            }
            for (const stale of ["'ko-fi.com'","'tally.so'","'whop.com'"]) {
              assert(!html.includes(stale), 'Legacy active tracking domain present: ' + stale);
            }

            console.log(JSON.stringify({status:res.status(), live, canonical, stripeHref:href, gaValue:ga[2].value, posthogValue:ph[1].value, mobileOverflow:overflow, pageErrors:errors}, null, 2));
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          JS
          NODE_PATH="$PWD/node_modules" node /tmp/qa-system.js
