name: Fix Live Refresh Candidate Prices

on:
  push:
    paths:
      - '.github/workflows/fix-live-refresh-candidate-prices.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install parser
        run: python -m pip install --quiet beautifulsoup4
      - name: Correct only stale offer values and validate
        run: |
          python <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup, NavigableString

          root = Path('wordpress/slayerkey-website/previews/live-refresh')

          # Coaching: preserve the live cards and styling, change only stale offer data/behavior.
          cpath = root/'coaching-live-refresh-v1'/'index.html'
          soup = BeautifulSoup(cpath.read_text(encoding='utf-8'), 'html.parser')
          pricing = soup.select_one('#coaching-pricing')
          cards = pricing.select('.price-card') if pricing else []
          if len(cards) < 2:
              raise SystemExit(f'Expected two live pricing cards, found {len(cards)}')
          cards[0].select_one('.price .amount').string = '$1,200'
          cards[0].select_one('.price .per').string = 'paid in full'
          cards[1].select_one('.price .amount').string = '$325'
          cards[1].select_one('.price .per').string = '× 4'
          old_button = cards[0].select_one('button.btn')
          if old_button:
              old_button.name = 'a'
              for attr in ('data-cal-config','data-cal-link','data-cal-namespace','type'):
                  old_button.attrs.pop(attr, None)
              old_button['href'] = 'https://buy.stripe.com/00w28q3IR4eg8IZ8VH04806'
              old_button['target'] = '_self'
              old_button.string = 'Start Your Mentorship'
          for node in list(soup.find_all(string=True)):
              if node.parent and node.parent.name in ('script','style'):
                  continue
              value = str(node)
              if 'Full Improvement System included ($197 value)' in value:
                  node.replace_with(NavigableString(value.replace('Full Improvement System included ($197 value)', 'Lifetime Improvement System access included')))
          visible = soup.get_text(' ', strip=True)
          for stale in ('$150', '$870', '$197', '6 private 1:1 sessions over 90 days'):
              if stale in visible:
                  raise SystemExit(f'Stale Coaching offer data remains: {stale}')
          if not any(a.get('href') == 'https://buy.stripe.com/00w28q3IR4eg8IZ8VH04806' for a in soup.find_all('a')):
              raise SystemExit('Paid-in-full Stripe checkout missing')
          if not any(a.get('href') == 'https://buy.stripe.com/4gM00i3IR4eg3oF0pb04805' for a in soup.find_all('a')):
              raise SystemExit('Four-payment Stripe checkout missing')
          if any('tally.so' in (a.get('href') or '') for a in soup.find_all('a')):
              raise SystemExit('Stale Tally link remains in Coaching candidate')
          cpath.write_text(str(soup), encoding='utf-8')

          # System: preserve each live testimonial card; update only inaccurate credential labels.
          spath = root/'system-live-refresh-v1'/'index.html'
          ssoup = BeautifulSoup(spath.read_text(encoding='utf-8'), 'html.parser')
          for card in ssoup.select('.review-card'):
              author = card.select_one('.author')
              cred = card.select_one('.cred')
              if not author or not cred:
                  continue
              who = author.get_text(' ', strip=True)
              if 'Eternity' in who:
                  cred.string = 'Thought he had little to learn → quickly proven wrong'
              elif 'FreezeChamp' in who:
                  cred.string = 'System owner'
              elif 'Tecz' in who:
                  cred.string = 'Diamond 1 → Radiant #215 • 621 RR'
          spath.write_text(str(ssoup), encoding='utf-8')

          svisible = ssoup.get_text(' ', strip=True)
          for stale in ('$197', '$15/month', 'From $150'):
              if stale in svisible:
                  raise SystemExit(f'Stale System value remains: {stale}')
          if not any(a.get('href') == 'https://buy.stripe.com/28EbJ04MV4ege3j8VH04804' for a in ssoup.find_all('a')):
              raise SystemExit('System Stripe checkout missing')
          if any('ko-fi.com/s/e34dd9cdef' in (a.get('href') or '') for a in ssoup.find_all('a')):
              raise SystemExit('Stale System Ko-fi checkout remains')
          if 'Diamond 1 → Ascendant 1' in svisible or 'Busy schedule → consistent progress' in svisible:
              raise SystemExit('Unsupported System testimonial credential remains')
          print('Conservative live refresh candidates passed stale-offer validation')
          PY
      - name: Commit corrected candidates
        run: |
          git config user.name "slayerkey"
          git config user.email "34904637+slayerkey@users.noreply.github.com"
          git add wordpress/slayerkey-website/previews/live-refresh/coaching-live-refresh-v1/index.html wordpress/slayerkey-website/previews/live-refresh/system-live-refresh-v1/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Correct current offer data in live refresh candidates"
          git push
