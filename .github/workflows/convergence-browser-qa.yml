name: Convergence Browser QA

on:
  push:
    paths:
      - '.github/workflows/convergence-browser-qa.yml'
      - 'wordpress/slayerkey-website/previews/convergence/system-convergence-v5/**'
      - 'wordpress/slayerkey-website/previews/convergence/coaching-convergence-v5/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Wait for exact EasyWP deployment and v5 files
        shell: bash
        run: |
          set -euo pipefail
          SYSTEM_URL='https://slayerkey.com/wp-content/plugins/slayerkey-website/previews/convergence/system-convergence-v5/index.html'
          COACHING_URL='https://slayerkey.com/wp-content/plugins/slayerkey-website/previews/convergence/coaching-convergence-v5/index.html'
          for i in $(seq 1 48); do
            DEPLOYED=$(curl -fsSL --max-time 12 -H 'Cache-Control: no-cache' "https://slayerkey.com/wp-json/slayerkey/v1/health?cb=$GITHUB_SHA" | python -c "import json,sys; print(json.load(sys.stdin).get('deployed_commit') or '')" || true)
            SYSTEM=$(curl -fsSL --max-time 12 -H 'Cache-Control: no-cache' "$SYSTEM_URL?cb=$GITHUB_SHA" || true)
            COACHING=$(curl -fsSL --max-time 12 -H 'Cache-Control: no-cache' "$COACHING_URL?cb=$GITHUB_SHA" || true)
            echo "Attempt $i deployed=$DEPLOYED target=$GITHUB_SHA"
            if [ "$DEPLOYED" = "$GITHUB_SHA" ] && grep -q 'system_convergence_v5' <<<"$SYSTEM" && grep -q 'coaching_convergence_v5' <<<"$COACHING"; then
              exit 0
            fi
            sleep 5
          done
          echo 'Exact v5 previews did not become visible in time.' >&2
          exit 1

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: Run final deployed browser QA
        shell: bash
        run: |
          mkdir -p qa-artifacts
          cat > convergence-qa.js <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');

          const pages = {
            system: 'https://slayerkey.com/wp-content/plugins/slayerkey-website/previews/convergence/system-convergence-v5/index.html',
            coaching: 'https://slayerkey.com/wp-content/plugins/slayerkey-website/previews/convergence/coaching-convergence-v5/index.html'
          };
          const viewports = {
            desktop: { width: 1440, height: 900 },
            tablet: { width: 900, height: 1000 },
            mobile: { width: 390, height: 844 }
          };
          const expected = {
            systemStripe: 'https://buy.stripe.com/28EbJ04MV4ege3j8VH04804',
            coachingFull: 'https://buy.stripe.com/00w28q3IR4eg8IZ8VH04806',
            coachingPlan: 'https://buy.stripe.com/4gM00i3IR4eg3oF0pb04805'
          };

          function assert(condition, message, failures) {
            if (!condition) failures.push(message);
          }

          async function scrollAll(page, viewport) {
            const total = await page.evaluate(() => document.documentElement.scrollHeight);
            for (let y = 0; y < total; y += Math.max(340, Math.floor(viewport.height * 0.68))) {
              await page.evaluate(v => window.scrollTo(0, v), y);
              await page.waitForTimeout(120);
            }
            await page.evaluate(() => window.scrollTo(0, document.documentElement.scrollHeight));
            await page.waitForTimeout(450);
            await page.evaluate(() => window.scrollTo(0, 0));
            await page.waitForTimeout(350);
          }

          async function center(page, selector) {
            await page.locator(selector).first().evaluate(el => el.scrollIntoView({ block: 'center', behavior: 'instant' }));
            await page.waitForTimeout(180);
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const report = { sha: process.env.GITHUB_SHA, results: [] };
            let failed = false;

            for (const [pageName, url] of Object.entries(pages)) {
              for (const [mode, viewport] of Object.entries(viewports)) {
                const context = await browser.newContext({ viewport, reducedMotion: 'no-preference' });
                const page = await context.newPage();
                const pageErrors = [];
                page.on('pageerror', err => pageErrors.push(String(err)));

                const response = await page.goto(url + '?qa=' + process.env.GITHUB_SHA + '-' + mode, { waitUntil: 'domcontentloaded', timeout: 90000 });
                const failures = [];
                assert(response && response.status() === 200, `HTTP status was ${response && response.status()}`, failures);
                await page.waitForTimeout(800);

                const root = pageName === 'system' ? '#sk-system' : '#sk-coaching';
                assert(await page.locator(root).count() === 1, 'Expected page root not found', failures);
                const variant = await page.locator(root).getAttribute('data-page-variant');
                assert(variant === `${pageName}_convergence_v5`, `Wrong page variant: ${variant}`, failures);

                await scrollAll(page, viewport);

                const computed = await page.locator(root).evaluate(el => {
                  const h1 = el.querySelector('h1');
                  const hs = h1 ? getComputedStyle(h1) : null;
                  const reveals = [...el.querySelectorAll('.reveal')];
                  return {
                    h1FontSize: hs ? parseFloat(hs.fontSize) : 0,
                    h1Transform: hs ? hs.textTransform : null,
                    revealCount: reveals.length,
                    visibleReveals: reveals.filter(node => Number(getComputedStyle(node).opacity) > 0.9).length
                  };
                });
                assert(computed.h1FontSize > 30, 'Sales page CSS does not appear applied to H1', failures);
                assert(computed.h1Transform === 'uppercase', 'Display typography was not applied', failures);
                assert(computed.visibleReveals === computed.revealCount, `Not all reveals became visible: ${computed.visibleReveals}/${computed.revealCount}`, failures);

                const overflow = await page.evaluate(() => ({ scrollWidth: document.documentElement.scrollWidth, clientWidth: document.documentElement.clientWidth }));
                assert(overflow.scrollWidth <= overflow.clientWidth + 2, `Horizontal overflow ${overflow.scrollWidth} > ${overflow.clientWidth}`, failures);

                const images = await page.locator(`${root} img[src]:not([src=""])`).evaluateAll(imgs => imgs.map(img => ({
                  src: img.currentSrc || img.src,
                  complete: img.complete,
                  width: img.naturalWidth,
                  height: img.naturalHeight
                })));
                const brokenImages = images.filter(x => !x.src.includes('i.ytimg.com/') && (!x.complete || !x.width || !x.height));
                assert(brokenImages.length === 0, `Broken first party images: ${brokenImages.map(x => x.src).join(', ')}`, failures);

                const bodyText = await page.locator(root).innerText();
                for (const stale of ['$197', '$870', '$150', 'ko-fi.com', 'tally.so', 'usage guarantee', 'no outcome is guaranteed']) {
                  assert(!bodyText.toLowerCase().includes(stale.toLowerCase()), `Stale content present: ${stale}`, failures);
                }
                const heroText = await page.locator(`${root} section:first-of-type`).innerText();
                assert(!heroText.includes('$249') && !heroText.includes('$1,200') && !heroText.includes('$325'), 'Price appears in hero', failures);
                const sections = await page.locator(`${root} section`).evaluateAll(nodes => nodes.map(n => n.id || n.className));

                if (pageName === 'system') {
                  const src = await page.locator('#systemVideo').getAttribute('src');
                  assert(src && src.includes('DspVHi5gi88'), `Wrong System VSL: ${src}`, failures);
                  assert(await page.locator(`a[href^="${expected.systemStripe}"]`).count() >= 3, 'System checkout CTAs missing', failures);
                  assert(sections.indexOf('proof') < sections.indexOf('why') && sections.indexOf('why') < sections.indexOf('how') && sections.indexOf('how') < sections.indexOf('inside') && sections.indexOf('inside') < sections.indexOf('pricing'), `Unexpected System order: ${sections.join(' > ')}`, failures);
                  await center(page, '[data-proof-src]');
                  await page.locator('[data-proof-src]').first().click();
                  await page.waitForTimeout(150);
                  assert(await page.locator('#systemLightbox').evaluate(el => el.classList.contains('open')), 'System proof lightbox failed', failures);
                  await page.keyboard.press('Escape');
                } else {
                  const src = await page.locator('#coachingVideo').getAttribute('src');
                  assert(src && src.includes('pEa4AcERI_k'), `Wrong Coaching VSL: ${src}`, failures);
                  assert(await page.locator(`a[href^="${expected.coachingFull}"]`).count() === 1, 'Upfront checkout missing or duplicated', failures);
                  assert(await page.locator(`a[href^="${expected.coachingPlan}"]`).count() === 1, 'Four payment checkout missing or duplicated', failures);
                  assert(sections.indexOf('proof') < sections.indexOf('why') && sections.indexOf('why') < sections.indexOf('mentorship') && sections.indexOf('mentorship') < sections.indexOf('students') && sections.indexOf('students') < sections.indexOf('pricing'), `Unexpected Coaching order: ${sections.join(' > ')}`, failures);
                  assert(await page.locator('img[src*="beta-bronze-Copy.png"]').count() === 1, 'Bronze story proof missing', failures);
                  assert(await page.locator('img[src*="top600career-copy2.png"]').count() === 1, 'Peak story proof missing', failures);

                  await center(page, '.ch-review-track');
                  const track = page.locator('.ch-review-track');
                  const before = await track.evaluate(el => getComputedStyle(el).transform);
                  await page.waitForTimeout(1100);
                  const after = await track.evaluate(el => getComputedStyle(el).transform);
                  assert(before !== after && after !== 'none', 'Review rail did not move', failures);

                  await center(page, '[data-yt]');
                  await page.locator('[data-yt]').first().click();
                  await page.waitForTimeout(400);
                  assert(await page.locator('#coachingVideoLightbox').evaluate(el => el.classList.contains('open')), 'Testimonial modal failed', failures);
                  const frameBox = await page.locator('.ch-video-frame').boundingBox();
                  assert(frameBox && frameBox.width / frameBox.height > 1.70 && frameBox.width / frameBox.height < 1.82, 'Testimonial modal is not 16:9', failures);
                  await page.keyboard.press('Escape');

                  await center(page, '[data-proof-src]');
                  await page.locator('[data-proof-src]').first().click();
                  await page.waitForTimeout(150);
                  assert(await page.locator('#coachingLightbox').evaluate(el => el.classList.contains('open')), 'Coaching proof lightbox failed', failures);
                  await page.keyboard.press('Escape');
                }

                await scrollAll(page, viewport);
                const hero = await page.locator(`${root} section:first-of-type`).boundingBox();
                const pricing = await page.locator(`${root} #pricing`).boundingBox();
                const metrics = {
                  viewport,
                  scrollHeight: await page.evaluate(() => document.documentElement.scrollHeight),
                  heroHeight: hero && Math.round(hero.height),
                  pricingTop: pricing && Math.round(pricing.y),
                  imageCount: images.length,
                  sectionOrder: sections,
                  css: computed,
                  pageErrors
                };
                assert(pageErrors.length === 0, `Page errors: ${pageErrors.join(' | ')}`, failures);

                await page.screenshot({ path: `qa-artifacts/${pageName}-${mode}.png`, fullPage: true });
                report.results.push({ page: pageName, mode, failures, metrics });
                if (failures.length) failed = true;
                await context.close();
              }
            }

            await browser.close();
            fs.writeFileSync('qa-artifacts/report.json', JSON.stringify(report, null, 2));
            console.log(JSON.stringify(report, null, 2));
            if (failed) process.exit(1);
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
          node convergence-qa.js

      - name: Upload screenshots and QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: convergence-browser-qa-${{ github.sha }}
          path: qa-artifacts
          if-no-files-found: warn
