name: Publish Live Refresh Ready Previews

on:
  push:
    paths:
      - '.github/workflows/publish-live-refresh-ready.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy validated candidates to fresh preview paths
        run: |
          mkdir -p wordpress/slayerkey-website/previews/live-refresh/coaching-live-refresh-ready
          mkdir -p wordpress/slayerkey-website/previews/live-refresh/system-live-refresh-ready
          cp wordpress/slayerkey-website/previews/live-refresh/coaching-live-refresh-v1/index.html wordpress/slayerkey-website/previews/live-refresh/coaching-live-refresh-ready/index.html
          cp wordpress/slayerkey-website/previews/live-refresh/system-live-refresh-v1/index.html wordpress/slayerkey-website/previews/live-refresh/system-live-refresh-ready/index.html
      - name: Validate ready copies
        run: |
          python <<'PY'
          from pathlib import Path
          checks = {
            'coaching': Path('wordpress/slayerkey-website/previews/live-refresh/coaching-live-refresh-ready/index.html').read_text(encoding='utf-8'),
            'system': Path('wordpress/slayerkey-website/previews/live-refresh/system-live-refresh-ready/index.html').read_text(encoding='utf-8'),
          }
          c=checks['coaching']; s=checks['system']
          required_c=['$1,200','$325','Start Your Mentorship','https://buy.stripe.com/00w28q3IR4eg8IZ8VH04806','https://buy.stripe.com/4gM00i3IR4eg3oF0pb04805','Lazy • Diamond 1 to Radiant #91 NA','Darkblood • Plat 2 to Immortal 3','Chrake • Plat 2 to Ascendant 3']
          stale_c=['$150','$870','$197','6 private 1:1 sessions over 90 days','tally.so']
          required_s=['$249','https://buy.stripe.com/28EbJ04MV4ege3j8VH04804','Thought he had little to learn → quickly proven wrong','g09 • Gold 2 to Diamond 1','Ruin • Ascendant 2 to Radiant']
          stale_s=['$197','ko-fi.com/s/e34dd9cdef','Diamond 1 → Ascendant 1','Busy schedule → consistent progress']
          for x in required_c:
            assert x in c, f'Missing Coaching: {x}'
          for x in stale_c:
            assert x not in c, f'Stale Coaching: {x}'
          for x in required_s:
            assert x in s, f'Missing System: {x}'
          for x in stale_s:
            assert x not in s, f'Stale System: {x}'
          print('Ready copies validated')
          PY
      - name: Commit fresh preview paths
        run: |
          git config user.name "slayerkey"
          git config user.email "34904637+slayerkey@users.noreply.github.com"
          git add wordpress/slayerkey-website/previews/live-refresh/coaching-live-refresh-ready wordpress/slayerkey-website/previews/live-refresh/system-live-refresh-ready
          git commit -m "Publish conservative live refresh review pair"
          git push
