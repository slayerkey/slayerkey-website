name: Promote System Live V7 Fixed

on:
  push:
    paths:
      - '.github/workflows/promote-system-live-v7-fixed.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install parser
        run: python -m pip install --quiet beautifulsoup4
      - name: Build live System candidate and route
        run: |
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          import re

          src = Path('wordpress/slayerkey-website/previews/live-refresh/system-live-refresh-v6/index.html')
          dst = Path('wordpress/slayerkey-website/previews/live-refresh/system-live-refresh-v7-live/index.html')
          plugin = Path('wordpress/slayerkey-website/slayerkey-website.php')
          soup = BeautifulSoup(src.read_text(encoding='utf-8'), 'html.parser')

          offer = soup.select_one('#final .system-offer-shell')
          if not offer:
              raise SystemExit('Missing System offer shell')
          meta = offer.select_one('.system-offer-meta')
          if not meta:
              raise SystemExit('Missing System offer meta')
          existing = offer.select_one('.system-coaching-alt')
          if existing:
              existing.decompose()
          alt = soup.new_tag('p')
          alt['class'] = ['system-coaching-alt']
          alt['style'] = 'margin:.7rem 0 0;text-align:center;font-size:.9rem;color:var(--muted)'
          alt.append('Prefer 1:1 coaching? ')
          coaching = soup.new_tag('a')
          coaching['href'] = '/coaching/'
          coaching['data-cta'] = 'offer_coaching'
          coaching['style'] = 'color:var(--teal);font-weight:800;text-decoration:none'
          coaching.string = 'See coaching options'
          alt.append(coaching)
          meta.insert_after(alt)

          for script in soup.find_all('script'):
              if not script.string:
                  continue
              s = script.string
              s = s.replace("linker: { domains: ['slayerkey.com','buy.stripe.com','ko-fi.com','tally.so','whop.com'] }", "linker: { domains: ['slayerkey.com','buy.stripe.com'] }")
              s = s.replace("const OUT = ['buy.stripe.com','ko-fi.com','youtube.com','youtu.be','twitch.tv','discord.gg','tally.so','whop.com'];", "const OUT = ['buy.stripe.com','youtube.com','youtu.be','twitch.tv','discord.gg'];")
              s = s.replace('Keep sessions when users hop to Ko-fi or your Tally form', 'Keep sessions when users continue to Stripe checkout')
              s = s.replace('GA4 never sees the purchase itself (that happens on Whop/Ko-fi), so this is the last\n    measurable step on our side. The purchase event fires on /welcome.', 'begin_checkout is the last measurable website step before Stripe. Completed payment remains Stripe-side.')
              script.string.replace_with(s)

          marker = soup.find('meta', attrs={'name':'slayerkey-preview-variant'})
          if marker:
              marker['content'] = 'system_live_refresh_v7_live'
          else:
              marker = soup.new_tag('meta')
              marker['name'] = 'slayerkey-preview-variant'
              marker['content'] = 'system_live_refresh_v7_live'
              soup.head.append(marker)

          dst.parent.mkdir(parents=True, exist_ok=True)
          dst.write_text(str(soup), encoding='utf-8')
          built = dst.read_text(encoding='utf-8')
          for value in ['system_live_refresh_v7_live','Prefer 1:1 coaching?','See coaching options','href="/coaching/"','https://buy.stripe.com/28EbJ04MV4ege3j8VH04804','price_1U8WzqArG6inWxHPI4WlZjPo','value:249','G-0SZBZW0HP6','edge.slayerkey.com','v9sofegg9a','https://slayerkey.com/system/','Ascendant 2 → Radiant','8 Days']:
              if value not in built:
                  raise SystemExit('Missing live marker: ' + value)
          for stale in ["'ko-fi.com'","'tally.so'","'whop.com'"]:
              if stale in built:
                  raise SystemExit('Legacy active tracking domain remains: ' + stale)

          php = plugin.read_text(encoding='utf-8')
          php = php.replace(' * Version: 0.1.27', ' * Version: 0.1.28')
          php = php.replace("define( 'SLAYERKEY_WEBSITE_VERSION', '0.1.27' );", "define( 'SLAYERKEY_WEBSITE_VERSION', '0.1.28' );")
          php = php.replace('// Flip to true to replace the legacy Elementor /system page with the GitHub managed System v4.', '// Public /system now uses the approved GitHub managed live refresh page.')
          php = php.replace("define( 'SLAYERKEY_PUBLIC_SYSTEM_ENABLED', false );", "define( 'SLAYERKEY_PUBLIC_SYSTEM_ENABLED', true );")

          pattern = re.compile(r"function slayerkey_website_render_public_system\(\) \{.*?\n\}\nadd_action\( 'template_redirect', 'slayerkey_website_render_public_system', 1 \);", re.S)
          replacement = "function slayerkey_website_render_public_system() {\n    if ( ! slayerkey_website_is_public_system_request() ) {\n        return;\n    }\n\n    $system_file = plugin_dir_path( __FILE__ ) . 'previews/live-refresh/system-live-refresh-v7-live/index.html';\n\n    if ( ! is_readable( $system_file ) ) {\n        return;\n    }\n\n    $html = file_get_contents( $system_file );\n\n    if ( false === $html ) {\n        return;\n    }\n\n    $html = str_replace(\n        '<meta content=\"system_live_refresh_v7_live\" name=\"slayerkey-preview-variant\"/>',\n        '<meta content=\"system-live-refresh-v7\" name=\"slayerkey-live-page\"/>',\n        $html\n    );\n\n    global $wp_query;\n    if ( $wp_query instanceof WP_Query ) {\n        $wp_query->is_404 = false;\n        $wp_query->is_page = true;\n    }\n\n    status_header( 200 );\n    nocache_headers();\n    header( 'Content-Type: text/html; charset=' . get_option( 'blog_charset' ) );\n    echo $html; // phpcs:ignore WordPress.Security.EscapeOutput.OutputNotEscaped\n    exit;\n}\nadd_action( 'template_redirect', 'slayerkey_website_render_public_system', 1 );"
          php, count = pattern.subn(replacement, php, count=1)
          if count != 1:
              raise SystemExit('Could not replace public System renderer')
          plugin.write_text(php, encoding='utf-8')

          check = plugin.read_text(encoding='utf-8')
          for value in ["SLAYERKEY_PUBLIC_SYSTEM_ENABLED', true", 'system-live-refresh-v7-live/index.html', 'Version: 0.1.28']:
              if value not in check:
                  raise SystemExit('Missing plugin promotion marker: ' + value)
          print('Built and routed System live candidate')
          PY
      - name: Commit production promotion
        run: |
          git config user.name "slayerkey"
          git config user.email "34904637+slayerkey@users.noreply.github.com"
          git add wordpress/slayerkey-website/previews/live-refresh/system-live-refresh-v7-live/index.html wordpress/slayerkey-website/slayerkey-website.php
          git commit -m "Promote Improvement System live refresh"
          git push
