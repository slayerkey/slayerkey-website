name: Convergence v8 Sticky Final

on:
  push:
    paths:
      - '.github/workflows/convergence-v8-sticky-final.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sticky:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Wait for deployment
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            D=$(curl -fsSL --max-time 12 "https://slayerkey.com/wp-json/slayerkey/v1/health?cb=$GITHUB_SHA" | python -c "import json,sys; print(json.load(sys.stdin).get('deployed_commit') or '')" || true)
            S=$(curl -fsSL --max-time 12 "https://slayerkey.com/wp-content/plugins/slayerkey-website/previews/convergence/system-convergence-v8-ready/index.html?cb=$GITHUB_SHA" || true)
            if [ "$D" = "$GITHUB_SHA" ] && grep -q 'system_convergence_v8' <<<"$S"; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Verify sticky with real scroll behavior
        shell: bash
        run: |
          cat > sticky.js <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const viewport of [{width:1440,height:900},{width:900,height:1000},{width:390,height:844}]){
              const ctx=await browser.newContext({viewport});const page=await ctx.newPage();
              await page.goto('https://slayerkey.com/wp-content/plugins/slayerkey-website/previews/convergence/system-convergence-v8-ready/index.html?sticky='+process.env.GITHUB_SHA,{waitUntil:'domcontentloaded',timeout:90000});
              await page.waitForTimeout(700);
              const sticky=page.locator('#systemSticky');
              if(await sticky.evaluate(e=>e.classList.contains('show'))) throw new Error('sticky visible before pricing');
              const priceY=(await page.locator('#pricing').boundingBox()).y;
              await page.evaluate(()=>document.documentElement.style.scrollBehavior='auto');
              await page.evaluate(y=>window.scrollTo(0,y),priceY+30);
              await page.waitForTimeout(200);
              const y=await page.evaluate(()=>window.scrollY);
              if(y<priceY-10) throw new Error(`did not cross pricing threshold: scrollY=${y}, priceY=${priceY}`);
              if(!(await sticky.evaluate(e=>e.classList.contains('show')))) throw new Error(`sticky did not appear after real threshold: scrollY=${y}, priceY=${priceY}`);
              const href=await sticky.locator('a').getAttribute('href');
              if(!href.includes('28EbJ04MV4ege3j8VH04804')) throw new Error('wrong sticky checkout');
              await ctx.close();
            }
            await browser.close();console.log('System sticky purchase behavior passed at desktop, tablet, and mobile.');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node sticky.js