name: QA Coaching Live Refresh V2

on:
  push:
    paths:
      - '.github/workflows/qa-coaching-live-refresh-v2.yml'

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright
          npx playwright install --with-deps chromium >/dev/null
      - name: Wait for public candidate
        run: |
          URL='https://slayerkey.com/wp-content/plugins/slayerkey-website/previews/live-refresh/coaching-live-refresh-v2/index.html'
          for i in $(seq 1 40); do
            BODY=$(curl -fsSL --max-time 20 "$URL" || true)
            if printf '%s' "$BODY" | grep -q 'coaching-live-refresh-v2'; then
              echo 'Candidate is public'
              exit 0
            fi
            echo "Waiting for candidate deployment ($i/40)"
            sleep 10
          done
          echo 'Candidate did not become public in time'
          exit 1
      - name: Browser layout QA
        run: |
          cat > qa.mjs <<'JS'
          import { chromium } from 'playwright';
          const url = 'https://slayerkey.com/wp-content/plugins/slayerkey-website/previews/live-refresh/coaching-live-refresh-v2/index.html';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:1365,height:900}});
          const errors=[];
          page.on('pageerror', e => errors.push(String(e)));
          await page.goto(url,{waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForTimeout(2500);

          const desktop = await page.evaluate(() => {
            const q=s=>document.querySelector(s);
            const qa=s=>[...document.querySelectorAll(s)];
            const rect=e=>e?.getBoundingClientRect();
            const cards=qa('#coaching-pricing .price-card');
            const names=qa('#showcase .result-name');
            const impacts=qa('#showcase .result-impact');
            const cap=q('#showcase .result-card figcaption');
            const ids=['showcase','proof-wall','psmr','how','reviews','coaching-pricing','about'];
            return {
              marker:q('meta[name="slayerkey-candidate"]')?.content,
              cta:qa('a.btn').map(a=>a.textContent.trim()),
              hasOldReviewLink:document.body.innerText.includes('See 480+ five-star reviews'),
              levi:document.body.innerText.includes('Plat 1 → Immortal'),
              rohit:document.body.innerText.includes('Gold 3 → Immortal 1'),
              cardRects:cards.map(c=>({x:rect(c).x,y:rect(c).y,w:rect(c).width,h:rect(c).height})),
              order:ids.map(id=>({id,y:rect(q('#'+id))?.top + window.scrollY})),
              overflow:document.documentElement.scrollWidth-window.innerWidth,
              captionAlign:getComputedStyle(cap).textAlign,
              captionDisplay:getComputedStyle(cap).display,
              nameSize:names.length?parseFloat(getComputedStyle(names[0]).fontSize):0,
              impactSize:impacts.length?parseFloat(getComputedStyle(impacts[0]).fontSize):0,
            };
          });

          if(desktop.marker!=='coaching-live-refresh-v2') throw new Error('Wrong candidate marker');
          if(!desktop.cta.includes('Apply for Mentorship')) throw new Error('Apply for Mentorship CTA missing');
          if(desktop.hasOldReviewLink) throw new Error('Old review link still visible');
          if(!desktop.levi || !desktop.rohit) throw new Error('Video transformation captions missing');
          if(desktop.cardRects.length!==2) throw new Error('Expected exactly two pricing cards');
          const [a,b]=desktop.cardRects;
          if(Math.abs(a.y-b.y)>8 || Math.abs(a.x-b.x)<100) throw new Error(`Pricing cards are not side by side: ${JSON.stringify(desktop.cardRects)}`);
          if(desktop.overflow>2) throw new Error(`Desktop horizontal overflow: ${desktop.overflow}px`);
          if(desktop.captionAlign!=='center' || desktop.captionDisplay!=='flex') throw new Error('Transformation captions are not centered flex layouts');
          if(!(desktop.impactSize >= desktop.nameSize + 5)) throw new Error(`Transformation impact is not visually dominant: name=${desktop.nameSize}, impact=${desktop.impactSize}`);
          const ys=desktop.order.map(x=>x.y);
          for(let i=1;i<ys.length;i++) if(!(ys[i]>ys[i-1])) throw new Error(`Wrong section order: ${JSON.stringify(desktop.order)}`);

          await page.setViewportSize({width:390,height:844});
          await page.reload({waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForTimeout(1500);
          const mobile = await page.evaluate(() => {
            const cards=[...document.querySelectorAll('#coaching-pricing .price-card')].map(c=>{const r=c.getBoundingClientRect();return{x:r.x,y:r.y,w:r.width,h:r.height}});
            return {cards,overflow:document.documentElement.scrollWidth-window.innerWidth};
          });
          if(mobile.cards.length!==2) throw new Error('Mobile pricing cards missing');
          const [m1,m2]=mobile.cards;
          if(!(m2.y > m1.y + m1.h - 5)) throw new Error(`Mobile cards are not stacked: ${JSON.stringify(mobile.cards)}`);
          if(mobile.overflow>2) throw new Error(`Mobile horizontal overflow: ${mobile.overflow}px`);
          if(errors.length) throw new Error(`Page JS errors: ${errors.join(' | ')}`);

          console.log(JSON.stringify({desktop,mobile},null,2));
          await browser.close();
          JS
          node qa.mjs
