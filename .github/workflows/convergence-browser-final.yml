name: Final Convergence Browser QA

on:
  push:
    paths:
      - '.github/workflows/convergence-browser-final.yml'
      - 'wordpress/slayerkey-website/previews/convergence/system-convergence-v4/**'
      - 'wordpress/slayerkey-website/previews/convergence/coaching-convergence-v4/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Wait for exact deployment
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 48); do
            D=$(curl -fsSL --max-time 12 'https://slayerkey.com/wp-json/slayerkey/v1/health' | python -c "import json,sys; print(json.load(sys.stdin).get('deployed_commit') or '')" || true)
            echo "deployed=$D target=$GITHUB_SHA"
            [ "$D" = "$GITHUB_SHA" ] && exit 0
            sleep 5
          done
          exit 1
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Render and test
        shell: bash
        run: |
          mkdir -p qa-final
          cat > final-qa.js <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const urls = {
            system: 'https://slayerkey.com/wp-content/plugins/slayerkey-website/previews/convergence/system-convergence-v4/index.html',
            coaching: 'https://slayerkey.com/wp-content/plugins/slayerkey-website/previews/convergence/coaching-convergence-v4/index.html'
          };
          const sizes = { desktop:[1440,900], tablet:[900,1000], mobile:[390,844] };
          const bronze = [
            'https://slayerkey.com/wp-content/uploads/2025/01/beta-bronze-Copy.png',
            'https://slayerkey.com/wp-content/uploads/2025/01/top600career-copy2.png'
          ];
          const fail = (ok, msg, arr) => { if (!ok) arr.push(msg); };
          async function scrollAll(page, h) {
            const total = await page.evaluate(() => document.documentElement.scrollHeight);
            for (let y=0; y<total; y+=Math.max(340, Math.floor(h*.68))) {
              await page.evaluate(v => window.scrollTo(0,v), y);
              await page.waitForTimeout(120);
            }
            await page.evaluate(() => window.scrollTo(0, document.documentElement.scrollHeight));
            await page.waitForTimeout(450);
            await page.evaluate(() => window.scrollTo(0,0));
            await page.waitForTimeout(350);
          }
          async function domScroll(page, selector) {
            await page.locator(selector).evaluate(el => el.scrollIntoView({block:'center', behavior:'instant'}));
            await page.waitForTimeout(180);
          }
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const result = {sha:process.env.GITHUB_SHA, bronzeAssets:[], pages:[]};
            let bad = false;
            const probe = await browser.newContext();
            for (const url of bronze) {
              try {
                const r = await probe.request.get(url,{timeout:20000});
                result.bronzeAssets.push({url,status:r.status(),ok:r.ok(),contentType:r.headers()['content-type']||''});
              } catch(e) { result.bronzeAssets.push({url,status:null,ok:false,error:String(e)}); }
            }
            await probe.close();

            for (const [name,url] of Object.entries(urls)) {
              for (const [mode,dims] of Object.entries(sizes)) {
                const [width,height]=dims;
                const context=await browser.newContext({viewport:{width,height},reducedMotion:'no-preference'});
                const page=await context.newPage();
                const errors=[];
                page.on('pageerror',e=>errors.push(String(e)));
                const response=await page.goto(url+'?finalqa='+Date.now(),{waitUntil:'domcontentloaded',timeout:90000});
                const failures=[];
                fail(response&&response.status()===200,'HTTP not 200',failures);
                await page.waitForTimeout(800);
                await scrollAll(page,height);
                const root=name==='system'?'#sk-system':'#sk-coaching';
                fail(await page.locator(root).count()===1,'root missing',failures);
                const layout=await page.locator(root).evaluate(el=>{
                  const h1=el.querySelector('h1'); const hs=getComputedStyle(h1);
                  const reveals=[...el.querySelectorAll('.reveal')];
                  return {
                    h1Size:parseFloat(hs.fontSize),
                    h1Transform:hs.textTransform,
                    revealTotal:reveals.length,
                    revealVisible:reveals.filter(x=>parseFloat(getComputedStyle(x).opacity)>.9).length
                  };
                });
                fail(layout.h1Size>30,'CSS typography missing',failures);
                fail(layout.h1Transform==='uppercase','display typography missing',failures);
                fail(layout.revealTotal===layout.revealVisible,`reveal failure ${layout.revealVisible}/${layout.revealTotal}`,failures);
                const over=await page.evaluate(()=>[document.documentElement.scrollWidth,document.documentElement.clientWidth]);
                fail(over[0]<=over[1]+2,`horizontal overflow ${over[0]}/${over[1]}`,failures);
                const firstPartyBroken=await page.locator(`${root} img[src]:not([src=""])`).evaluateAll(imgs=>imgs.map(i=>({src:i.currentSrc||i.src,w:i.naturalWidth,h:i.naturalHeight,complete:i.complete})).filter(i=>!i.src.includes('i.ytimg.com/')&&(!i.complete||!i.w||!i.h)));
                fail(!firstPartyBroken.length,'broken images '+firstPartyBroken.map(x=>x.src).join(','),failures);
                const text=(await page.locator(root).innerText()).toLowerCase();
                for(const stale of ['$197','$870','$150','ko-fi.com','tally.so','usage guarantee','no outcome is guaranteed']) fail(!text.includes(stale.toLowerCase()),'stale '+stale,failures);
                const hero=(await page.locator(`${root} section:first-of-type`).innerText());
                fail(!hero.includes('$249')&&!hero.includes('$1,200')&&!hero.includes('$325'),'price in hero',failures);
                const order=await page.locator(`${root} section`).evaluateAll(n=>n.map(x=>x.id||x.className));
                if(name==='system'){
                  fail((await page.locator('#systemVideo').getAttribute('src')||'').includes('DspVHi5gi88'),'wrong System VSL',failures);
                  fail(await page.locator('a[href^="https://buy.stripe.com/28EbJ04MV4ege3j8VH04804"]').count()>=3,'System checkout missing',failures);
                  fail(order.indexOf('proof')<order.indexOf('why')&&order.indexOf('why')<order.indexOf('how')&&order.indexOf('how')<order.indexOf('inside')&&order.indexOf('inside')<order.indexOf('pricing'),'System order wrong',failures);
                  await domScroll(page,'[data-proof-src]');
                  await page.locator('[data-proof-src]').first().click(); await page.waitForTimeout(150);
                  fail(await page.locator('#systemLightbox').evaluate(x=>x.classList.contains('open')),'System proof modal failed',failures);
                  await page.keyboard.press('Escape');
                } else {
                  fail((await page.locator('#coachingVideo').getAttribute('src')||'').includes('pEa4AcERI_k'),'wrong Coaching VSL',failures);
                  fail(await page.locator('a[href^="https://buy.stripe.com/00w28q3IR4eg8IZ8VH04806"]').count()===1,'upfront checkout wrong',failures);
                  fail(await page.locator('a[href^="https://buy.stripe.com/4gM00i3IR4eg3oF0pb04805"]').count()===1,'four pay checkout wrong',failures);
                  fail(order.indexOf('proof')<order.indexOf('why')&&order.indexOf('why')<order.indexOf('mentorship')&&order.indexOf('mentorship')<order.indexOf('students')&&order.indexOf('students')<order.indexOf('pricing'),'Coaching order wrong',failures);
                  await domScroll(page,'.ch-review-track');
                  const track=page.locator('.ch-review-track');
                  const a=await track.evaluate(x=>getComputedStyle(x).transform); await page.waitForTimeout(1100); const b=await track.evaluate(x=>getComputedStyle(x).transform);
                  fail(a!==b&&b!=='none','review rail not moving',failures);
                  await domScroll(page,'[data-yt]');
                  await page.locator('[data-yt]').first().click(); await page.waitForTimeout(400);
                  fail(await page.locator('#coachingVideoLightbox').evaluate(x=>x.classList.contains('open')),'testimonial modal failed',failures);
                  const box=await page.locator('.ch-video-frame').boundingBox();
                  fail(box&&box.width/box.height>1.70&&box.width/box.height<1.82,'testimonial modal not 16:9',failures);
                  await page.keyboard.press('Escape');
                  await domScroll(page,'[data-proof-src]');
                  await page.locator('[data-proof-src]').first().click(); await page.waitForTimeout(150);
                  fail(await page.locator('#coachingLightbox').evaluate(x=>x.classList.contains('open')),'proof modal failed',failures);
                  await page.keyboard.press('Escape');
                }
                await scrollAll(page,height);
                const heroBox=await page.locator(`${root} section:first-of-type`).boundingBox();
                const priceBox=await page.locator(`${root} #pricing`).boundingBox();
                result.pages.push({name,mode,failures,metrics:{width,height,scrollHeight:await page.evaluate(()=>document.documentElement.scrollHeight),heroHeight:heroBox&&Math.round(heroBox.height),pricingTop:priceBox&&Math.round(priceBox.y),order,layout,pageErrors:errors}});
                if(failures.length) bad=true;
                await page.screenshot({path:`qa-final/${name}-${mode}.png`,fullPage:true});
                await context.close();
              }
            }
            await browser.close();
            fs.writeFileSync('qa-final/report.json',JSON.stringify(result,null,2));
            console.log(JSON.stringify(result,null,2));
            if(bad) process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node final-qa.js
      - name: Upload final QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-convergence-browser-qa-${{ github.sha }}
          path: qa-final
          if-no-files-found: warn
