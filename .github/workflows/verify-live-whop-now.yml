name: Verify Live Whop Diagnostic
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read live Whop diagnostic
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -fsS --max-time 20 -A 'Slayerkey-Whop-Diagnostic/1.0' 'https://slayerkey.com/wp-json/slayerkey/v1/whop-attribution-health')"
          echo "$body" | jq .
