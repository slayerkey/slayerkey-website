name: Promote Coaching Live Refresh V3

on:
  push:
    paths:
      - '.github/workflows/promote-coaching-live-refresh-v3.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch tracking and public Coaching route
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          page_path = Path('wordpress/slayerkey-website/previews/live-refresh/coaching-live-refresh-v3/index.html')
          plugin_path = Path('wordpress/slayerkey-website/slayerkey-website.php')

          page = page_path.read_text(encoding='utf-8')

          # GA cross-domain linker: keep existing domains and add the current Stripe checkout host.
          old_linker = "linker: { domains: ['slayerkey.com','ko-fi.com','tally.so','whop.com'] }"
          new_linker = "linker: { domains: ['slayerkey.com','buy.stripe.com','ko-fi.com','tally.so','whop.com'] }"
          if old_linker not in page and new_linker not in page:
              raise SystemExit('GA linker block not found')
          page = page.replace(old_linker, new_linker)

          # Attribute current Stripe checkout links while preserving the visitor's inbound campaign.
          old_out = "const OUT = ['ko-fi.com','youtube.com','youtu.be','twitch.tv','discord.gg','tally.so','whop.com'];"
          new_out = "const OUT = ['buy.stripe.com','ko-fi.com','youtube.com','youtu.be','twitch.tv','discord.gg','tally.so','whop.com'];"
          if old_out not in page and new_out not in page:
              raise SystemExit('Outbound domain list not found')
          page = page.replace(old_out, new_out)

          # Do not force Stripe checkout into a new tab; preserve the authored same-tab purchase flow.
          old_decorate = """    if (!isOutbound(a.href)) return;\n    a.target = '_blank'; a.rel = 'noopener';\n    try{\n      const u = new URL(a.href, location.href);"""
          new_decorate = """    if (!isOutbound(a.href)) return;\n    try{\n      const u = new URL(a.href, location.href);\n      if (u.hostname !== 'buy.stripe.com'){ a.target = '_blank'; a.rel = 'noopener'; }"""
          if old_decorate not in page and new_decorate not in page:
              raise SystemExit('Outbound decorator block not found')
          page = page.replace(old_decorate, new_decorate)

          # Replace stale Whop/Ko-fi checkout definitions with the two current Mentorship Stripe options.
          checkout_pattern = re.compile(r"  const CHECKOUTS = \[\n.*?\n  \];", re.S)
          matches = checkout_pattern.findall(page)
          if len(matches) != 1:
              raise SystemExit(f'Expected one checkout map, found {len(matches)}')
          current_checkout_map = """  const CHECKOUTS = [
    { match:'buy.stripe.com/00w28q3IR4eg8IZ8VH04806', value:1200, name:'Private Mentorship — One Time', id:'price_1U4qemArG6inWxHPnTaPZG6r' },
    { match:'buy.stripe.com/4gM00i3IR4eg3oF0pb04805', value:1300, name:'Private Mentorship — Four Monthly Payments', id:'price_1U8X2WArG6inWxHPrHbN7G34' }
  ];"""
          page = checkout_pattern.sub(current_checkout_map, page, count=1)

          page = page.replace(
              "GA4 never sees the purchase itself (that happens on Whop/Ko-fi), so this is the last\n    measurable step on our side. The purchase event fires on /welcome.",
              "GA4 records the checkout start on Slayerkey before the browser hands off to Stripe.\n    Stripe remains the payment source of truth for the completed purchase."
          )

          # Mirror checkout starts into PostHog explicitly in addition to GA4/autocapture.
          ga_block = """      gtag('event','begin_checkout',{\n        currency: 'USD',\n        value: co.value,\n        cta_location: sectionName(el),\n        items: [{ item_id: co.id, item_name: co.name, price: co.value, quantity: 1 }],\n        debug_mode: SK_DEBUG\n      });"""
          ph_block = ga_block + """
      if (window.posthog && typeof window.posthog.capture === 'function'){
        posthog.capture('begin_checkout',{
          currency: 'USD',
          value: co.value,
          item_id: co.id,
          item_name: co.name,
          cta_location: sectionName(el),
          link_url: href
        });
      }"""
          if ga_block not in page:
              raise SystemExit('GA begin_checkout block not found')
          if "posthog.capture('begin_checkout'" not in page:
              page = page.replace(ga_block, ph_block, 1)

          # Remove the obsolete Whop page pixel from this Stripe-only Coaching page.
          page = re.sub(
              r'<!--\n  Whop pixel\..*?whop\.track\("page"\);\n</script>\n',
              '',
              page,
              count=1,
              flags=re.S
          )

          # Assertions for current production tracking.
          for required in [
              'buy.stripe.com/00w28q3IR4eg8IZ8VH04806',
              'buy.stripe.com/4gM00i3IR4eg3oF0pb04805',
              "value:1200",
              "value:1300",
              "posthog.capture('begin_checkout'",
              "'buy.stripe.com'",
              "linker: { domains: ['slayerkey.com','buy.stripe.com'",
          ]:
              if required not in page:
                  raise SystemExit('Missing tracking marker: '+required)
          for stale in [
              "match:'whop.com/checkout/plan_TOSvOOLdpQXzi'",
              "match:'ko-fi.com/s/e34dd9cdef'",
              "match:'ko-fi.com/s/cd324493ce'",
              'whop.track("page")',
          ]:
              if stale in page:
                  raise SystemExit('Stale checkout tracking remains: '+stale)

          page_path.write_text(page, encoding='utf-8')

          plugin = plugin_path.read_text(encoding='utf-8')
          plugin = plugin.replace('Version: 0.1.26', 'Version: 0.1.27', 1)
          plugin = plugin.replace("define( 'SLAYERKEY_WEBSITE_VERSION', '0.1.26' );", "define( 'SLAYERKEY_WEBSITE_VERSION', '0.1.27' );", 1)

          if "SLAYERKEY_PUBLIC_COACHING_ENABLED" not in plugin:
              anchor = "define( 'SLAYERKEY_PUBLIC_SYSTEM_ENABLED', false );"
              if anchor not in plugin:
                  raise SystemExit('System public flag anchor missing')
              plugin = plugin.replace(anchor, anchor + "\ndefine( 'SLAYERKEY_PUBLIC_COACHING_ENABLED', true );", 1)

          coaching_functions = r'''
function slayerkey_website_is_public_coaching_request() {
    if ( ! SLAYERKEY_PUBLIC_COACHING_ENABLED || is_admin() || slayerkey_website_is_private_preview_request() ) {
        return false;
    }

    return '/coaching' === slayerkey_website_public_request_path();
}

function slayerkey_website_render_public_coaching() {
    if ( ! slayerkey_website_is_public_coaching_request() ) {
        return;
    }

    $coaching_file = plugin_dir_path( __FILE__ ) . 'previews/live-refresh/coaching-live-refresh-v3/index.html';

    if ( ! is_readable( $coaching_file ) ) {
        return;
    }

    $html = file_get_contents( $coaching_file );

    if ( false === $html ) {
        return;
    }

    // Mark the routed production document without changing the preserved candidate source.
    $html = str_replace(
        '<meta content="coaching-live-refresh-v3" name="slayerkey-candidate"/>',
        '<meta content="coaching-live-refresh-v3" name="slayerkey-live-page"/>',
        $html
    );

    global $wp_query;
    if ( $wp_query instanceof WP_Query ) {
        $wp_query->is_404 = false;
        $wp_query->is_page = true;
    }

    status_header( 200 );
    nocache_headers();
    header( 'Content-Type: text/html; charset=' . get_option( 'blog_charset' ) );
    echo $html; // phpcs:ignore WordPress.Security.EscapeOutput.OutputNotEscaped
    exit;
}
add_action( 'template_redirect', 'slayerkey_website_render_public_coaching', 1 );

'''
          if 'function slayerkey_website_is_public_coaching_request()' not in plugin:
              anchor = 'function slayerkey_website_is_public_system_request() {'
              pos = plugin.find(anchor)
              if pos == -1:
                  raise SystemExit('Public System function anchor missing')
              plugin = plugin[:pos] + coaching_functions + plugin[pos:]

          # Production assertions.
          for required in [
              "define( 'SLAYERKEY_PUBLIC_COACHING_ENABLED', true );",
              "return '/coaching' === slayerkey_website_public_request_path();",
              "previews/live-refresh/coaching-live-refresh-v3/index.html",
              "slayerkey_website_render_public_coaching",
              "SLAYERKEY_WEBSITE_VERSION', '0.1.27'",
          ]:
              if required not in plugin:
                  raise SystemExit('Missing production routing marker: '+required)

          plugin_path.write_text(plugin, encoding='utf-8')
          print('Patched Coaching tracking and production route')
          PY
      - name: Commit production promotion
        run: |
          git config user.name "slayerkey"
          git config user.email "34904637+slayerkey@users.noreply.github.com"
          git add wordpress/slayerkey-website/slayerkey-website.php wordpress/slayerkey-website/previews/live-refresh/coaching-live-refresh-v3/index.html
          git commit -m "Promote Coaching live refresh v3"
          git push
