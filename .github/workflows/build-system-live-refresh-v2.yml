name: Build System Live Refresh V2

on:
  push:
    paths:
      - '.github/workflows/build-system-live-refresh-v2.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install parser
        run: python -m pip install --quiet beautifulsoup4
      - name: Build conservative System v2
        run: |
          python - <<'PY'
          from bs4 import BeautifulSoup
          from pathlib import Path

          src = Path('wordpress/slayerkey-website/previews/live-refresh/system-live-refresh-ready/index.html')
          out = Path('wordpress/slayerkey-website/previews/live-refresh/system-live-refresh-v2/index.html')
          html = src.read_text(encoding='utf-8')
          soup = BeautifulSoup(html, 'html.parser')

          # Fresh candidate marker.
          marker = soup.find('meta', attrs={'name':'slayerkey-candidate'})
          if marker:
              marker['content'] = 'system-live-refresh-v2'
          else:
              marker = soup.new_tag('meta')
              marker['name'] = 'slayerkey-candidate'
              marker['content'] = 'system-live-refresh-v2'
              soup.head.append(marker)

          # Hero: warm up first. No price or guarantee before the buyer understands the System.
          hero = soup.select_one('#top')
          if not hero:
              raise SystemExit('Hero not found')
          price_lock = hero.select_one('.sk-price-lockup')
          if price_lock:
              price_lock.decompose()
          guarantee_line = hero.select_one('.sk-guarantee-line')
          if guarantee_line:
              guarantee_line.decompose()
          hero_buttons = hero.select('a.btn')
          if hero_buttons:
              hero_buttons[0]['href'] = '#solution'
              hero_buttons[0]['target'] = '_self'
              hero_buttons[0].string = 'See How It Works'
          if len(hero_buttons) > 1:
              hero_buttons[1]['href'] = '#inside'
              hero_buttons[1]['target'] = '_self'
              hero_buttons[1].string = "See What's Inside"

          # Remove the early post-proof purchase band.
          for band in soup.select('.cta-band'):
              if 'Ready to stop guessing and start improving?' in band.get_text(' ', strip=True):
                  parent = band.parent
                  if parent and parent.name == 'div' and 'container' in (parent.get('class') or []):
                      parent.decompose()
                  else:
                      band.decompose()

          # No buy CTA inside the explanatory sections. Pricing comes after understanding.
          for section_id in ('how','inside'):
              section = soup.select_one('#'+section_id)
              if section:
                  for a in list(section.select('a[href*="buy.stripe.com"]')):
                      p = a.parent
                      a.decompose()
                      if p and not p.get_text(' ', strip=True) and not p.find(True):
                          p.decompose()

          showcase = soup.select_one('#showcase')
          solution = soup.select_one('#solution')
          how = soup.select_one('#how')
          inside = soup.select_one('#inside')
          final = soup.select_one('#final')
          proof = soup.select_one('#proof-wall')
          reviews = soup.select_one('#wb-reviews')
          guarantee = soup.select_one('#guarantee')
          if not all([showcase, solution, how, inside, final, proof]):
              raise SystemExit('Required System sections missing')

          # Replace the large early Discord wall with two compact owner voices.
          owner = BeautifulSoup('''
          <section id="owner-voices" class="owner-voices">
            <div class="container">
              <div class="owner-voice-grid reveal">
                <article class="owner-voice">
                  <p>“I was stuck in Silver/Gold since Episode 5. Within 21 days of following the routines and aim training, I reached Plat 1.”</p>
                  <div class="owner-meta"><strong>DeputySanders</strong><span>Gold 1 → Platinum 1</span></div>
                </article>
                <article class="owner-voice">
                  <p>“I was Diamond and didn't believe I had much to learn from the system. I was quickly proven wrong. It is worth it at any rank.”</p>
                  <div class="owner-meta"><strong>Eternity</strong><span>System owner</span></div>
                </article>
              </div>
            </div>
          </section>
          ''','html.parser').section
          showcase.insert_after(owner)

          # Move the real offer after the product has been explained.
          final.extract()
          inside.insert_after(final)

          # Turn the existing final CTA into the first real purchase decision.
          eyebrow = final.select_one('.eyebrow')
          if eyebrow:
              eyebrow.string = 'The Improvement System'
          h2 = final.find('h2')
          if h2:
              h2.string = 'Get The Full System'
          price_line = final.find('p', string=lambda s: s and '$249' in s)
          # BeautifulSoup may not match because the price is nested. Find by text instead.
          if not price_line:
              for p in final.find_all('p'):
                  if '$249' in p.get_text(' ', strip=True):
                      price_line = p
                      break
          if price_line:
              price_line.clear()
              strong = soup.new_tag('strong')
              strong['style'] = 'font-family:var(--font-display);font-weight:400;font-size:1.5rem;color:#fff'
              strong.string = '$249'
              price_line.append(strong)
              price_line.append(' one-time  •  Lifetime access  •  30-day guarantee')
          offer_btn = final.select_one('a[href*="buy.stripe.com"]')
          if offer_btn:
              offer_btn.string = 'Get The System'

          # Deeper social proof now comes after the price for buyers who need more reassurance.
          proof.extract()
          final.insert_after(proof)
          proof_intro = proof.select_one('.container > .reveal')
          if proof_intro:
              proof_intro.clear()
              eyebrow2 = soup.new_tag('div')
              eyebrow2['class'] = ['eyebrow']
              eyebrow2.string = 'More From System Owners'
              title2 = soup.new_tag('h2')
              title2.string = 'What Players Say After Using It'
              proof_intro.append(eyebrow2)
              proof_intro.append(title2)

          # The full moving text review rail is redundant now: two owner quotes before the
          # mechanism + real Discord screenshots after price are enough.
          if reviews:
              reviews.decompose()

          # Remove standalone guarantee section. Guarantee belongs beside the $249 offer.
          if guarantee:
              guarantee.decompose()

          # Make the inside section answer the buyer question directly.
          inside_h2 = inside.find('h2')
          if inside_h2:
              inside_h2.string = "What's Actually Inside The System"

          # Add minimal isolated styles without changing the existing visual language.
          style = soup.new_tag('style')
          style.string = '''
          #sk-wb #owner-voices{padding-top:10px;padding-bottom:34px}
          #sk-wb .owner-voice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;max-width:900px;margin:0 auto}
          #sk-wb .owner-voice{border:1px solid var(--line);background:linear-gradient(180deg,rgba(17,28,39,.88),rgba(17,28,39,.58));padding:20px 22px;border-radius:2px}
          #sk-wb .owner-voice p{margin:0;color:var(--ink);font-size:1rem;line-height:1.65}
          #sk-wb .owner-meta{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
          #sk-wb .owner-meta strong{font-size:.78rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
          #sk-wb .owner-meta span{font-size:.78rem;color:var(--teal);font-weight:800}
          #sk-wb #proof-wall .container>.reveal{text-align:center!important}
          #sk-wb #proof-wall .container>.reveal h2{margin:.3rem 0 0}
          @media(max-width:700px){
            #sk-wb .owner-voice-grid{grid-template-columns:1fr}
            #sk-wb .owner-meta{align-items:flex-start;flex-direction:column;gap:3px}
          }
          '''
          soup.head.append(style)

          # Hard structural assertions.
          if soup.select_one('#guarantee'):
              raise SystemExit('Standalone guarantee section still present')
          if soup.select_one('#wb-reviews'):
              raise SystemExit('Redundant review rail still present')
          if hero.select_one('.sk-price-lockup') or hero.select_one('.sk-guarantee-line'):
              raise SystemExit('Hero still exposes price/guarantee')
          if any(a.get('href','').startswith('https://buy.stripe.com') for a in how.select('a')):
              raise SystemExit('Early buy CTA still in How section')
          if any(a.get('href','').startswith('https://buy.stripe.com') for a in inside.select('a')):
              raise SystemExit('Early buy CTA still in Inside section')
          if '$249' not in final.get_text(' ', strip=True) or '30-day guarantee' not in final.get_text(' ', strip=True):
              raise SystemExit('Offer price/guarantee missing')

          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(str(soup), encoding='utf-8')
          print('Built', out)
          PY
      - name: Commit candidate
        run: |
          git config user.name "slayerkey"
          git config user.email "34904637+slayerkey@users.noreply.github.com"
          git add wordpress/slayerkey-website/previews/live-refresh/system-live-refresh-v2/index.html
          git commit -m "Refine System warmup and offer journey"
          git push
