name: Deploy Slayerkey Website to EasyWP
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'wordpress/**'
      - 'tools/build_deploy.py'
      - 'tools/publish_deploy.py'
      - 'tools/verify-live.mjs'
      - 'tools/release-contract.mjs'
      - 'tools/playback.mjs'
      - '.github/workflows/deploy.yml'
permissions:
  contents: read
  statuses: write
concurrency:
  group: slayerkey-easywp-production
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOY_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y lftp
      - name: Mark deployment pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: context.sha, state: 'pending', context: 'easywp/deploy',
              description: 'Publishing assets, then verifying ordinary homepage'
            });
      - name: Build immutable release
        run: python3 tools/build_deploy.py --commit "$DEPLOY_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: build/
          retention-days: 30
      - name: Verify assets before publishing references
        env:
          EASYWP_HOST: ${{ secrets.EASYWP_HOST }}
          EASYWP_USER: ${{ secrets.EASYWP_USER }}
          EASYWP_PASSWORD: ${{ secrets.EASYWP_PASSWORD }}
          EASYWP_PORT: ${{ secrets.EASYWP_PORT }}
        run: python3 tools/publish_deploy.py
      - name: Verify ordinary URLs and browser runtime after publication
        run: npm run test:live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-verification-${{ github.sha }}
          path: artifacts/live/
      - name: Record final deployment status
        if: always()
        uses: actions/github-script@v7
        env:
          RESULT: ${{ job.status }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: context.sha,
              state: process.env.RESULT === 'success' ? 'success' : 'failure',
              context: 'easywp/deploy',
              description: process.env.RESULT === 'success' ? 'Ordinary URLs and browser runtime verified' : 'Release incomplete; inspect runtime/cache verification'
            });
