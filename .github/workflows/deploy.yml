name: Deploy Slayerkey Website to EasyWP
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'wordpress/**'
      - 'tools/build_deploy.py'
      - 'tools/publish_deploy.py'
      - 'tools/release-contract.mjs'
      - 'tools/playback.mjs'
      - '.github/workflows/deploy.yml'
permissions:
  contents: read
  statuses: write
concurrency:
  group: slayerkey-easywp-production
  cancel-in-progress: false

jobs:
  classify:
    name: classify change
    runs-on: ubuntu-latest
    outputs:
      full_checks: ${{ steps.classify.outputs.full_checks }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: classify
        name: Choose reliability gate
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "push" ]]; then
            echo "full_checks=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="${{ github.event.before }}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi

          if [[ -z "$base" ]]; then
            echo "full_checks=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files="$(git diff --name-only "$base" "$GITHUB_SHA")"
          printf 'Changed files:\n%s\n' "$files"

          full_checks=false
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            case "$file" in
              wordpress/slayerkey-website/pages/*/live/index.html|wordpress/slayerkey-website/DEPLOY_MARKER.txt|wordpress/slayerkey-website/DEPLOY_TRIGGER_*.txt)
                ;;
              *)
                full_checks=true
                break
                ;;
            esac
          done <<< "$files"

          echo "full_checks=$full_checks" >> "$GITHUB_OUTPUT"

  checks:
    name: full reliability gate
    needs: classify
    if: needs.classify.outputs.full_checks == 'true'
    uses: ./.github/workflows/checks.yml

  fast-checks:
    name: copy-only fast gate
    needs: classify
    if: needs.classify.outputs.full_checks != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:unit
      - run: python3 tests/publish_test.py
      - run: npm run test:php
      - run: python3 tools/build_deploy.py --output build/php-check/plugin
      - run: php tests/wordpress.php build/php-check/plugin
      - name: Desktop and mobile content smoke
        run: >
          npx playwright test tests/browser/homepage.spec.mjs
          --project=chromium-desktop
          --project=chromium-390
          --grep "native content, section scrolling, chooser, proof, footer, and reload"

  deploy:
    if: always() && github.ref == 'refs/heads/main' && (needs.checks.result == 'success' || needs.fast-checks.result == 'success')
    needs: [classify, checks, fast-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOY_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim runner disk for release publication
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          df -h /
      - run: sudo apt-get update && sudo apt-get install -y lftp
      - name: Mark deployment pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: context.sha, state: 'pending', context: 'easywp/deploy',
              description: 'Publishing to EasyWP and verifying uploaded bytes'
            });
      - name: Build immutable release
        run: python3 tools/build_deploy.py --commit "$DEPLOY_SHA"
      - name: Archive immutable release when Actions storage is available
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: build/
          retention-days: 1
      - name: Publish to EasyWP and verify remote bytes
        env:
          EASYWP_HOST: ${{ secrets.EASYWP_HOST }}
          EASYWP_USER: ${{ secrets.EASYWP_USER }}
          EASYWP_PASSWORD: ${{ secrets.EASYWP_PASSWORD }}
          EASYWP_PORT: ${{ secrets.EASYWP_PORT }}
        run: python3 tools/publish_deploy.py
      - name: Record successful deployment
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: context.sha,
              state: 'success',
              context: 'easywp/deploy',
              description: 'Published to EasyWP; remote bytes verified'
            });
      - name: Record publication failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: context.sha,
              state: 'failure',
              context: 'easywp/deploy',
              description: 'EasyWP publication or remote-byte verification failed'
            });
